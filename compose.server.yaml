services:
  db:
    container_name: zhoubao-server-db
  api:
    container_name: zhoubao-server-api
    image: zhoubao-server-api:3.0.1
    environment:
      COOKIE_PATH: /zhoubao
      COOKIE_SECURE: "true"
  web:
    container_name: zhoubao-server-web
    image: zhoubao-server-web:3.0.1
    build:
      context: ./frontend
      args:
        VITE_BASE: /zhoubao/
    volumes:
      - ./frontend/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
