services:
  db:
    container_name: zhoubao-server-db
  api:
    container_name: zhoubao-server-api
    image: zhoubao-server-api:2.1.3
    environment:
      COOKIE_PATH: /zhoubao
      COOKIE_SECURE: "true"
  web:
    container_name: zhoubao-server-web
    image: zhoubao-server-web:2.1.3
    build:
      context: ./frontend
      args:
        VITE_BASE: /zhoubao/
    volumes:
      - ./frontend/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
